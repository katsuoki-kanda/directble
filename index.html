<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI Pose BLE Controller</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f0f0; padding: 20px; }
        .controls { margin-bottom: 20px; padding: 15px; background: white; border-radius: 10px; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 5px; border: none; background: #007bff; color: white; font-weight: bold; }
        button:disabled { background: #ccc; }
        #status { margin-top: 10px; color: #666; }
        canvas { border-radius: 8px; background: #000; }
    </style>
</head>
<body>

    <div class="controls">
        <button id="connectBtn">BLEで接続する</button>
        <div id="status">ステータス: 未接続</div>
    </div>

    <div style="position: relative;">
        <video id="input_video" style="display:none;"></video>
        <canvas id="output_canvas" width="640px" height="480px"></canvas>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let characteristic = null;
        const statusDiv = document.getElementById('status');
        const connectBtn = document.getElementById('connectBtn');

        // --- BLE接続処理 ---
        connectBtn.addEventListener('click', async () => {
            try {
                statusDiv.innerText = "デバイスを探しています...";
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32-AI-Pose' }],
                    optionalServices: [SERVICE_UUID]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                statusDiv.innerText = "BLE接続成功！カメラを起動します...";
                connectBtn.disabled = true;
                startCamera();
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "接続失敗: " + error.message;
            }
        });

        async function sendSignal(msg) {
            if (characteristic) {
                const encoder = new TextEncoder();
                await characteristic.writeValue(encoder.encode(msg + "\n"));
            }
        }

        // --- MediaPipe / Pose 判定 ---
        const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
        pose.setOptions({ modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        
        let lastL = "", lastR = "";
        pose.onResults((results) => {
            const canvasCtx = document.getElementById('output_canvas').getContext('2d');
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, 640, 480);
            canvasCtx.drawImage(results.image, 0, 0, 640, 480);

            if (results.poseLandmarks) {
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 4});
                
                const lW = results.poseLandmarks[16].y, lS = results.poseLandmarks[12].y;
                const rW = results.poseLandmarks[15].y, rS = results.poseLandmarks[11].y;

                const curL = (lW < lS) ? "on" : "off";
                if (curL !== lastL) { sendSignal(`pin12/${curL}`); lastL = curL; }

                const curR = (rW < rS) ? "on" : "off";
                if (curR !== lastR) { sendSignal(`pin13/${curR}`); lastR = curR; }
            }
            canvasCtx.restore();
        });

        function startCamera() {
            const camera = new Camera(document.getElementById('input_video'), {
                onFrame: async () => { await pose.send({image: document.getElementById('input_video')}); },
                width: 640, height: 480
            });
            camera.start();
        }
    </script>
</body>
</html>
