<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI Pose BLE Multi-Control</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f4f4f9; }
        .panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: 20px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 8px; transition: 0.3s; }
        button:disabled { background: #6c757d; }
        #status { margin-top: 10px; color: #555; font-weight: bold; }
        canvas { border-radius: 10px; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="panel">
        <button id="connectBtn">BLE接続して開始</button>
        <div id="status">ステータス: 未接続</div>
    </div>

    <div style="position: relative;">
        <video id="input_video" style="display:none;"></video>
        <canvas id="output_canvas" width="640px" height="480px"></canvas>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let characteristic = null;
        let isSending = false;
        const statusDiv = document.getElementById('status');
        const connectBtn = document.getElementById('connectBtn');

        // BLE接続処理
        connectBtn.addEventListener('click', async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32-AI-Pose' }],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                statusDiv.innerText = "接続中：カメラ起動中...";
                connectBtn.disabled = true;
                startCamera();
            } catch (err) {
                statusDiv.innerText = "エラー: " + err;
            }
        });

        // 状態をまとめて送信する関数
        async function sendState(leftOn, rightOn) {
            if (!characteristic || isSending) return;
            isSending = true; 
            try {
                const msg = `L:${leftOn ? 1 : 0},R:${rightOn ? 1 : 0}\n`;
                const encoder = new TextEncoder();
                await characteristic.writeValue(encoder.encode(msg));
            } catch (e) {
                console.warn("送信失敗", e);
            }
            isSending = false;
        }

        const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
        pose.setOptions({ modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

        let lastL = false, lastR = false;

        pose.onResults((results) => {
            const canvasCtx = document.getElementById('output_canvas').getContext('2d');
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, 640, 480);
            canvasCtx.drawImage(results.image, 0, 0, 640, 480);

            if (results.poseLandmarks) {
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#FF0000', lineWidth: 1});

                // 判定ロジック
                const leftHandUp = results.poseLandmarks[16].y < results.poseLandmarks[12].y;
                const rightHandUp = results.poseLandmarks[15].y < results.poseLandmarks[11].y;

                // どちらかの状態が変わったときだけ送信
                if (leftHandUp !== lastL || rightHandUp !== lastR) {
                    lastL = leftHandUp;
                    lastR = rightHandUp;
                    sendState(leftHandUp, rightHandUp);
                }
                statusDiv.innerText = `接続中 (左:${leftHandUp?'ON':'OFF'} 右:${rightHandUp?'ON':'OFF'})`;
            }
            canvasCtx.restore();
        });

        function startCamera() {
            const camera = new Camera(document.getElementById('input_video'), {
                onFrame: async () => { await pose.send({image: document.getElementById('input_video')}); },
                width: 640, height: 480
            });
            camera.start();
        }
    </script>
</body>
</html>
